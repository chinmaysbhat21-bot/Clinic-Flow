                        },
                        "upcoming": {
                          "type": "object",
                          "properties": {
                            "confirmed": {
                              "type": "integer"
                            },
                            "pending": {
                              "type": "integer"
                            }
                          },
                          "required": [
                            "confirmed",
                            "pending"
                          ]
                        },
                        "totals": {
                          "type": "object",
                          "properties": {
                            "confirmed": {
                              "type": "integer"
                            },
                            "pending": {
                              "type": "integer"
                            },
                            "cancelled": {
                              "type": "integer"
                            },
                            "refundPending": {
                              "type": "integer"
                            },
                            "refunded": {
                              "type": "integer"
                            }
                          },
                          "required": [
                            "confirmed",
                            "pending",
                            "cancelled",
                            "refundPending",
                            "refunded"
                          ]
                        },
                        "reconciliation": {
                          "type": "object",
                          "properties": {
                            "pending": {
                              "type": "integer"
                            },
                            "manual": {
                              "type": "integer"
                            },
                            "total": {
                              "type": "integer"
                            }
                          },
                          "required": [
                            "pending",
                            "manual",
                            "total"
                          ]
                        },
                        "notifications": {
                          "type": "object",
                          "properties": {
                            "pending": {
                              "type": "integer"
                            },
                            "simulated": {
                              "type": "integer"
                            },
                            "delivered": {
                              "type": "integer"
                            },
                            "suppressed": {
                              "type": "integer"
                            },
                            "failedManual": {
                              "type": "integer"
                            }
                          },
                          "required": [
                            "pending",
                            "simulated",
                            "delivered",
                            "suppressed",
                            "failedManual"
                          ]
                        },
                        "finance": {
                          "type": "object",
                          "properties": {
                            "currency": {
                              "const": "INR"
                            },
                            "verifiedPayments": {
                              "type": "object",
                              "properties": {
                                "count": {
                                  "type": "integer"
                                },
                                "amount": {
                                  "type": "integer"
                                }
                              },
                              "required": [
                                "count",
                                "amount"
                              ]
                            },
                            "pendingRefunds": {
                              "type": "object",
                              "properties": {
                                "count": {
                                  "type": "integer"
                                },
                                "amount": {
                                  "type": "integer"
                                }
                              },
                              "required": [
                                "count",
                                "amount"
                              ]
                            },
                            "completedRefunds": {
                              "type": "object",
                              "properties": {
                                "count": {
                                  "type": "integer"
                                },
                                "amount": {
                                  "type": "integer"
                                }
                              },
                              "required": [
                                "count",
                                "amount"
                              ]
                            },
                            "refundOperations": {
                              "type": "object",
                              "properties": {
                                "pendingCount": {
                                  "type": "integer"
                                },
                                "pendingAmount": {
                                  "type": "integer"
                                },
                                "manualCount": {
                                  "type": "integer"
                                }
                              },
                              "required": [
                                "pendingCount",
                                "pendingAmount",
                                "manualCount"
                              ]
                            },
                            "createdPaymentsCount": {
                              "type": "integer"
                            },
                            "failedPaymentsCount": {
                              "type": "integer"
                            }
                          },
                          "required": [
                            "currency",
                            "verifiedPayments",
                            "pendingRefunds",
                            "completedRefunds",
                            "refundOperations",
                            "createdPaymentsCount",
                            "failedPaymentsCount"
                          ]
                        }
                      },
                      "required": [
                        "today",
                        "upcoming",
                        "totals",
                        "reconciliation",
                        "notifications",
                        "finance"
                      ]
                    },
                    "requestId": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "ok",
                    "data",
                    "requestId"
                  ]
                },
                "example": {
                  "ok": true,
                  "data": {
                    "today": {
                      "date": "2026-12-01",
                      "total": 0,
                      "confirmed": 0,
                      "pending": 0,
                      "cancelled": 0,
                      "refundPending": 0,
                      "refunded": 0
