    "/api/admin/refunds": {
      "get": {
        "summary": "List refund operations for the authenticated clinic",
        "security": [
          {
            "AdminBearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "id": {
                            "type": "string"
                          },
                          "amount": {
                            "type": "integer"
                          },
                          "currency": {
                            "const": "INR"
                          },
                          "reason": {
                            "enum": [
                              "ELIGIBLE_CANCELLATION",
                              "EXPIRED_RESERVATION",
                              "BOOKING_NOT_CREATED"
                            ]
                          },
                          "status": {
                            "enum": [
                              "PENDING",
                              "PROCESSING",
                              "COMPLETED",
                              "MANUAL"
                            ]
                          },
                          "attempts": {
                            "type": "integer"
                          },
                          "reviewReason": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "createdAt": {
                            "type": "integer"
                          },
                          "completedAt": {
                            "anyOf": [
                              {
                                "type": "integer"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "bookingReference": {
                            "anyOf": [
                              {
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          }
                        },
                        "required": [
                          "id",
                          "amount",
                          "currency",
                          "reason",
                          "status",
                          "attempts",
                          "reviewReason",
                          "createdAt",
                          "completedAt",
                          "bookingReference"
                        ]
                      }
                    },
                    "requestId": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "ok",
                    "data",
                    "requestId"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "ADMIN_AUTH_REQUIRED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "ORIGIN_NOT_ALLOWED",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "RATE_LIMIT",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "INTERNAL_ERROR",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
