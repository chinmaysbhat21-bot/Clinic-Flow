                            "COMPLETED",
                            "MANUAL",
                            "NOT_APPLICABLE"
                          ]
                        },
                        "amount": {
                          "anyOf": [
                            {
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "currency": {
                          "anyOf": [
                            {
                              "const": "INR"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        },
                        "completedAt": {
                          "anyOf": [
                            {
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ]
                        }
                      },
                      "required": [
                        "status",
                        "amount",
                        "currency",
                        "completedAt"
                      ]
                    },
                    "requestId": {
                      "type": "string"
                    }
                  },
                  "required": [
