      "Schedule": {
        "type": "object",
        "properties": {
          "days": {
            "type": "array",
            "items": {
              "type": "integer",
              "minimum": 0,
              "maximum": 6
            },
            "minItems": 1
          },
          "start": {
            "type": "integer",
            "minimum": 0,
            "maximum": 23
          },
          "end": {
            "type": "integer",
            "minimum": 1,
            "maximum": 24
          },
          "breaks": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "start",
                "end"
              ],
              "properties": {
                "start": {
                  "type": "string",
                  "pattern": "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
                },
                "end": {
                  "type": "string",
                  "pattern": "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
                },
                "days": {
                  "type": "array",
                  "items": {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 6
                  }
                }
              }
            }
          }
        },
        "required": [
          "days",
          "start",
          "end"
        ]
      },
      "Slot": {
        "type": "object",
        "properties": {
          "start": {
            "type": "string",
            "format": "date-time",
            "pattern": "Z$"
          },
          "end": {
            "type": "string",
            "format": "date-time",
            "pattern": "Z$"
          }
        },
        "required": [
          "start",
          "end"
        ]
      },
      "HoldRequest": {
        "type": "object",
