{
  "openapi": "3.1.0",
  "info": {
    "title": "Almost Humans API",
    "version": "0.1.0",
    "description": "Observed routes. Appointment and hold schemas are safe field projections of current responses, not a guarantee of redaction."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:4000"
    }
  ],
  "paths": {
    "/api/admin/session": {
      "delete": {
        "summary": "DELETE /api/admin/session",
        "security": [
          {
            "AdminBearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "Successful clinic-scoped result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "loggedOut": {
                          "const": true
                        }
                      },
                      "required": [
                        "loggedOut"
                      ]
                    },
                    "requestId": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "ok",
                    "data",
                    "requestId"
                  ]
                },
                "example": {
                  "ok": true,
                  "data": {
                    "loggedOut": true
                  },
                  "requestId": "request-demo"
                }
              }
            }
          },
          "401": {
            "description": "Admin session missing or expired"
          },
          "404": {
            "description": "Resource outside the clinic or missing"
          }
        }
      }
    },
