                      "pending": 0,
                      "manual": 0,
                      "total": 0
                    },
                    "notifications": {
                      "pending": 0,
                      "simulated": 0,
                      "delivered": 0,
                      "suppressed": 0,
                      "failedManual": 0
                    },
                    "finance": {
                      "currency": "INR",
                      "verifiedPayments": {
                        "count": 0,
                        "amount": 0
                      },
                      "pendingRefunds": {
                        "count": 0,
                        "amount": 0
                      },
                      "completedRefunds": {
                        "count": 0,
                        "amount": 0
                      },
                      "refundOperations": {
                        "pendingCount": 0,
                        "pendingAmount": 0,
                        "manualCount": 0
