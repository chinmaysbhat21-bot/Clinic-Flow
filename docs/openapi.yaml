            "AdminBearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "Successful clinic-scoped result"
          },
          "400": {
            "description": "Invalid request or job state"
          },
          "401": {
            "description": "Admin session missing or expired"
          },
          "404": {
            "description": "Resource outside the clinic or missing"
          },
          "409": {
            "description": "Authoritative provider evidence unavailable"
          }
        },
        "parameters": [
