    "/api/admin/appointments/{id}": {
      "get": {
        "summary": "GET /api/admin/appointments/{id}",
        "security": [
          {
            "AdminBearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "Successful clinic-scoped result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "ok": {
                      "const": true
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "reference": {
                          "type": "string"
                        },
                        "doctor_id": {
                          "type": "string"
                        },
                        "service_id": {
                          "type": "string"
                        },
                        "start": {
                          "type": "string",
                          "format": "date-time",
                          "pattern": "Z$"
                        },
                        "end": {
                          "type": "string",
                          "format": "date-time",
                          "pattern": "Z$"
                        },
                        "state": {
                          "type": "string",
                          "enum": [
                            "AVAILABLE",
                            "HELD",
                            "OTP_VERIFIED",
                            "PAYMENT_PENDING",
                            "PAYMENT_VERIFIED",
                            "CONFIRMATION_PENDING",
                            "CONFIRMED",
                            "EXPIRED",
                            "CANCELLED",
                            "PAYMENT_FAILED",
                            "REFUND_PENDING",
                            "REFUNDED"
                          ]
                        },
                        "fee": {
                          "type": [
                            "integer",
                            "null"
                          ]
                        },
                        "duration": {
                          "type": [
                            "integer",
                            "null"
                          ]
                        }
                      },
                      "required": [
                        "id",
                        "reference",
                        "doctor_id",
                        "service_id",
                        "start",
                        "end",
                        "state",
                        "fee",
                        "duration"
                      ]
                    },
                    "requestId": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "ok",
                    "data",
                    "requestId"
                  ]
                },
                "example": {
                  "ok": true,
                  "data": {
                    "id": "booking-demo",
                    "reference": "AH-DEMO1234",
                    "doctor_id": "lotus-doctor",
                    "service_id": "lotus-consult",
                    "start": "2026-12-01T03:30:00.000Z",
                    "end": "2026-12-01T04:00:00.000Z",
                    "state": "CONFIRMED",
                    "fee": 50000,
                    "duration": 30
                  },
                  "requestId": "request-demo"
                }
              }
            }
          },
          "401": {
            "description": "Admin session missing or expired"
          },
          "404": {
            "description": "Resource outside the clinic or missing"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
