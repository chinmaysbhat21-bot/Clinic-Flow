name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install widget build dependencies
        run: npm install --prefix apps/widget --no-save --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test
